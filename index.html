<style>
:root{--bg:#fff;--bg2:#f4f5fa;--tx:#111936;--mt:#6b7391;--ln:#e6e9f2;--pr:#ff5a36;--pr2:#e8431f;--nv:#111936;--tl:#10b3a3;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:Unbounded,"Trebuchet MS",sans-serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
.w{max-width:1200px;margin:0 auto;padding:0 16px}.mt{color:var(--mt)}
.tb{background:var(--nv);color:#fff;font-size:13px;text-align:center;padding:7px 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:9px;font:800 19px Unbounded,sans-serif;margin-right:4px}.lg b{color:var(--pr);font-weight:800}
.sr{flex:1;min-width:240px;display:flex;border:2px solid var(--nv);border-radius:14px;overflow:hidden;transition:box-shadow .2s}
.sr:focus-within{box-shadow:0 0 0 4px #ff5a3626}.sr input{flex:1;border:0;padding:10px 14px;outline:0;min-width:0}.sr .b{border-radius:0}
.hb{background:none;border:0;border-radius:12px;padding:9px 12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;transition:background .2s}
.hb:hover{background:var(--bg2)}.hb.pr{background:var(--nv);color:#fff}.hb.pr:hover{background:#232c55}
.cn{background:var(--pr);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.cm{display:none;border-top:1px solid var(--ln);background:#fff;box-shadow:0 20px 30px #11193614}.cm.o{display:block}
.cm .w{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;padding-top:12px;padding-bottom:12px}
.cm a{padding:9px 12px;border-radius:10px;transition:background .2s}.cm a:hover{background:var(--bg2)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-top:14px;padding-bottom:6px;scrollbar-width:none}
.ct{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:88px;font-size:12.5px;font-weight:600;text-align:center}
.ct i{font-style:normal;font-size:26px;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:var(--bg2);transition:background .2s,transform .2s}
.ct:hover i,.ct.on i{background:#ffe6de;transform:translateY(-3px)}.ct.on span{color:var(--pr)}
.b{display:inline-block;background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;text-align:center;transition:background .2s,transform .12s}
.b:hover{background:var(--pr2)}.b:active{transform:scale(.97)}.b.g{background:var(--bg2);color:var(--tx)}.b.g:hover{background:var(--ln)}.b.n{background:var(--nv)}.b.n:hover{background:#232c55}
.hero{margin-top:8px;border-radius:26px;background:linear-gradient(115deg,#111936 0%,#2b2080 58%,#ff5a36 135%);color:#fff;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;padding:36px;overflow:hidden}
.hero h1{font-size:clamp(34px,6vw,62px);margin:14px 0 10px}.hero p{font-size:19px;margin:0 0 22px;opacity:.92}
.chip{background:#ffffff26;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.hp{position:relative;min-height:270px}.hp a{position:absolute;width:46%;transition:transform .3s}
.hp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;box-shadow:0 18px 40px #0007;display:block}
.hp a:nth-child(1){left:0;top:8px;transform:rotate(-6deg)}.hp a:nth-child(2){right:0;top:0;transform:rotate(7deg)}.hp a:nth-child(3){left:28%;bottom:-8px;width:44%;transform:rotate(-1deg)}.hp a:hover{transform:scale(1.06);z-index:2}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.perks div{background:var(--bg2);border-radius:16px;padding:14px 16px;display:grid;gap:2px}.perks span{color:var(--mt);font-size:13px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:30px 0 14px}.sh h2{font-size:22px}.sh>a{color:var(--pr);font-weight:700}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{background:#fff;border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;position:relative;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.pc:hover{transform:translateY(-5px);box-shadow:0 16px 32px #1119361c}
.im{display:block;aspect-ratio:1;overflow:hidden;background:var(--bg2)}.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}.pc:hover .im img{transform:scale(1.07)}
.bd{position:absolute;left:10px;top:10px;background:var(--pr);color:#fff;border-radius:99px;padding:3px 10px;font-weight:800;font-size:13px}
.hv{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 12px #11193626;font-size:18px;transition:transform .2s}.hv:hover{transform:scale(1.15)}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}.pb .b{margin-top:auto}
.nm{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rt{font-size:13px;color:var(--mt)}
.np{font:800 18px Unbounded,sans-serif}.op{text-decoration:line-through;color:var(--mt);font-size:14px;margin-left:4px}
.big .pc{border:2px solid #ffd2c6}.big .np{font-size:22px;color:var(--pr)}.big .bd{font-size:15px;padding:5px 12px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-top:18px}.pp h1{font-size:26px;margin:8px 0}
.pim{border-radius:20px;overflow:hidden;background:#0b1020;align-self:start}.pim img{width:100%;display:block;aspect-ratio:1;object-fit:contain}
.bx{background:var(--bg2);border-radius:14px;padding:14px;display:grid;gap:6px;margin:14px 0}
.qr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.q{display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:12px}
.q button{width:36px;height:40px;border:0;background:none;font-size:18px}.q span{min-width:26px;text-align:center;font-weight:700}
.empty{background:var(--bg2);border-radius:18px;padding:34px;text-align:center;display:grid;gap:12px;justify-items:center}
.ord{border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}.oh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 8px}
.steps div{border-top:5px solid var(--ln);padding-top:6px;font-size:13px;color:var(--mt)}.steps .d{border-color:var(--tl);color:var(--tx);font-weight:700}.steps .c{border-color:var(--pr)}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.reg{border:1px solid var(--ln);border-radius:14px;padding:12px 14px}.reg b{color:var(--pr)}.reg p{margin:4px 0 0;color:var(--mt);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.card{border:1px solid var(--ln);border-radius:16px;padding:16px;display:grid;gap:8px}
.ov{position:fixed;inset:0;background:#0b102080;z-index:50;display:none;justify-content:flex-end}.ov.o{display:flex}.ov.c{justify-content:center;align-items:center}
.dr{background:#fff;width:min(440px,100%);height:100%;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dr h2{font-size:22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dr h3{margin:14px 0 6px;font-size:16px}
.md{background:#fff;border-radius:20px;padding:22px;width:min(380px,92%);display:grid;gap:8px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.it img{width:56px;height:56px;border-radius:10px;object-fit:cover}.in{flex:1;display:grid;font-size:14px}.x{border:0;background:none;font-size:18px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:4px 0}
.row{display:flex;gap:8px}.row input{flex:1}.msg{font-size:14px;min-height:20px}.ok{color:var(--tl)}.er{color:var(--pr2)}
.sum{display:flex;justify-content:space-between;padding:3px 0}.sum.t{font-weight:800;font-size:18px;border-top:1px solid var(--ln);margin-top:6px;padding-top:8px}
.al{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.al img{width:44px;height:44px;border-radius:8px;object-fit:cover}.al span{flex:1}.pv{width:90px;border-radius:10px}
footer{background:var(--nv);color:#cfd4ee;margin-top:48px;padding:36px 0 20px}.fg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}.fg a{display:block;padding:3px 0}.fg a:hover{color:#fff}
.fh{color:#fff;font-weight:800;margin-bottom:6px}.lg.f{color:#fff}.so{display:flex;gap:10px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nv);color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;z-index:99;display:none}
@media(max-width:820px){.sr{order:9;flex:1 1 100%}.hero,.pp,.two{grid-template-columns:1fr}.hero{padding:24px}.perks{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.hb span.t{display:none}}

function cnt(){const c=g("cart",{}),P=prods(),u=g("user",null);$("cc").textContent=P.reduce((s,p)=>s+(c[p.id]||0),0);$("fv").textContent=g("fav",[]).filter(id=>P.some(p=>p.id==id)).length;$("ub").innerHTML=u?"👤 <span class='t'>"+esc(u.n.split(" ")[0])+"</span>":"👤 <span class='t'>Kirish</span>"}
function add(id,q){const c={...g("cart",{})};c[id]=(c[id]||0)+(q||1);sv("cart",c);cnt();toast("Savatchaga qo‘shildi")}
function ch(id,d){const c={...g("cart",{})};c[id]=(c[id]||0)+d;if(c[id]<1)delete c[id];sv("cart",c);rl()}
function rm(id){const c={...g("cart",{})};delete c[id];sv("cart",c);rl()}
const dsc=s=>promo&&!g("ord",[]).length?Math.min(10000,s):0;
function oc(o){$("ov").classList.toggle("o",!!o);if(!o)return;const c=g("cart",{}),u=g("user",null)||{},H=`<h2>Savatcha <button class="b g" onclick="oc(0)" aria-label="Yopish">✕</button></h2>`;
if(!prods().some(p=>c[p.id])){$("dr").innerHTML=H+`<p>Savatchangiz bo‘sh.</p><a class="b" href="#/c/Hammasi" onclick="oc(0)">Xarid qilish</a>`;return}
$("dr").innerHTML=H+`<div id="cl"></div><div class="row"><input id="pc" placeholder="Promokod" value="${promo?"AKOSH10":""}"><button class="b g" onclick="pa()">Qo‘llash</button></div><div class="msg" id="pm"></div><div id="cs"></div><h3>Yetkazib berish manzili</h3><input id="nm" placeholder="Ism" value="${esc(u.n||"")}"><input id="ph" placeholder="Telefon: +998" inputmode="tel" value="${esc(u.p||"")}"><select id="rg" onchange="rc()"><option value="">Viloyatni tanlang</option>${Object.keys(REG).map(k=>`<option>${k}</option>`).join("")}</select><select id="ct"><option value="">Avval viloyatni tanlang</option></select><input id="ad" placeholder="Ko‘cha, uy raqami"><div class="msg er" id="em"></div><button class="b" style="width:100%" onclick="ck()">Buyurtma berish</button><p class="mt">🚚 2 kunda yetkazamiz · 🛡️ Sifat kafolati</p>`;rl()}
function rl(){const c=g("cart",{}),it=prods().filter(p=>c[p.id]);if(!it.length){oc(1);cnt();return}const sb=it.reduce((s,p)=>s+p.p*c[p.id],0),d=dsc(sb);
$("cl").innerHTML=it.map(p=>`<div class="it"><img src="${p.i||PH}" alt=""><div class="in"><a href="#/p/${p.id}" onclick="oc(0)">${esc(p.n)}</a><b>${fmt(p.p)}</b></div><div class="q"><button onclick="ch(${p.id},-1)" aria-label="Kamaytirish">−</button><span>${c[p.id]}</span><button onclick="ch(${p.id},1)" aria-label="Ko‘paytirish">+</button></div><button class="x" onclick="rm(${p.id})" aria-label="O‘chirish">🗑</button></div>`).join("");
$("cs").innerHTML=`<div class="sum"><span>Mahsulotlar</span><span>${fmt(sb)}</span></div>${d?`<div class="sum"><span>Chegirma (AKOSH10)</span><span>−${fmt(d)}</span></div>`:""}<div class="sum t"><span>Umumiy summa</span><span>${fmt(sb-d)}</span></div>`;cnt()}
function rc(){const r=$("rg").value;$("ct").innerHTML=r?REG[r].map(c=>`<option>${c}</option>`).join(""):'<option value="">Avval viloyatni tanlang</option>'}
function pa(){const v=$("pc").value.trim().toUpperCase(),m=$("pm");if(v!="AKOSH10"){promo=false;rl();$("pm").innerHTML='<span class="er">Promokod noto‘g‘ri</span>';return}
if(g("ord",[]).length){promo=false;rl();$("pm").innerHTML='<span class="er">AKOSH10 faqat birinchi buyurtma uchun</span>';return}promo=true;rl();$("pm").innerHTML='<span class="ok">AKOSH10 qo‘llandi: −10 000 so‘m</span>'}
function ck(){const n=$("nm").value.trim(),p=$("ph").value.trim(),r=$("rg").value,c=$("ct").value,a=$("ad").value.trim();
if(!n||p.replace(/\D/g,"").length<9||!r||!c||!a){$("em").textContent="Ism, telefon, viloyat, shahar va manzilni to‘liq kiriting.";return}
const cr=g("cart",{}),it=prods().filter(x=>cr[x.id]),sb=it.reduce((s,x)=>s+x.p*cr[x.id],0),d=dsc(sb),o=[...g("ord",[])];
o.push({id:1001+o.length,t:Date.now(),it:it.map(x=>({n:x.n,q:cr[x.id]})),total:sb-d,r,c,a,n,p});sv("ord",o);sv("cart",{});promo=false;if(!g("user",null))sv("user",{n,p});cnt();oc(0);location.hash="#/o";toast("Buyurtma qabul qilindi")}
function lgn(){const u=g("user",null);$("md").classList.add("o");$("mb").innerHTML=u?`<h2>${esc(u.n)}</h2><p class="mt">${esc(u.p)}</p><a class="b" href="#/o" onclick="mc()">Buyurtmalarim</a><button class="b g" onclick="sv('user',null);cnt();mc()">Chiqish</button>`:`<h2>Kirish</h2><p class="mt">Ism va telefon raqamingizni kiriting. Buyurtma berishda avtomatik to‘ldiriladi.</p><input id="ln" placeholder="Ism" autocomplete="name"><input id="lp" placeholder="Telefon: +998" inputmode="tel" autocomplete="tel"><div class="msg er" id="le"></div><button class="b" onclick="li()">Kirish</button><button class="b g" onclick="mc()">Bekor qilish</button>`}
function li(){const n=$("ln").value.trim(),p=$("lp").value.trim();if(!n||p.replace(/\D/g,"").length<9){$("le").textContent="Ism va to‘g‘ri telefon raqamini kiriting.";return}sv("user",{n,p});cnt();mc();toast("Xush kelibsiz, "+n.split(" ")[0])}
function mc(){$("md").classList.remove("o")}
$("lgo").innerHTML=logo(38)+"<span>Akosh <b>Market</b></span>";
const cl=c=>`<a class="ct" data-k="${esc(c[0])}" href="#/c/${encodeURIComponent(c[0])}"><i>${c[1]}</i><span>${c[0]}</span></a>`;
$("cats").innerHTML=cl(["Hammasi","🛍️"]).replace('href="#/c/Hammasi"','href="#/c/Hammasi"')+CATS.map(cl).join("");
$("cmi").innerHTML=CATS.map(c=>`<a href="#/c/${encodeURIComponent(c[0])}">${c[1]} ${c[0]}</a>`).join("");
$("ft").innerHTML=`<div class="w fg"><div><div class="lg f">${logo(36)}<span>Akosh <b>Market</b></span></div><p>Siz izlagan hamma narsa bir joyda!</p><div class="so"><button onclick="soc('instagram')" aria-label="Instagram">${I.ig}</button><button onclick="soc('telegram')" aria-label="Telegram">${I.tg}</button><button onclick="soc('youtube')" aria-label="YouTube">${I.yt}</button></div></div><div><div class="fh">Akosh Market</div><a href="#/i/about">Biz haqimizda</a><a href="#/i/contact">Aloqa</a></div><div><div class="fh">Xaridorlarga</div><a href="#/i/delivery">Yetkazib berish</a><a href="#/i/payment">To‘lov</a><a href="#/i/terms">Foydalanish shartlari</a></div><div><div class="fh">Profil</div><a href="#/o">Buyurtmalarim</a><a href="#/f">Sevimlilar</a></div></div><div class="w cp">© 2026 Akosh Market</div>`;
document.addEventListener("keydown",e=>{if(e.key=="Escape"){oc(0);mc()}});
addEventListener("hashchange",()=>route());cnt();route();
</script></body></html>
